<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abstract Flyer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="flyer">
    <header class="topbar">
      <span>www.company.com</span>
      <span class="brand">BRAND 2019</span>
    </header>

    <section class="top-collage" aria-label="Upper photo collage">
      <div class="top-column narrow">
        <img src="2.jpg" alt="White cat"> 
      </div>
      <div class="top-column">
        <img src="13.jpg" alt="black and white cat">
      </div>

      <div class="top-column middle">
        <img src="14.jpg" alt="white cat">
        <div class="middle-bottom">
          <img src="4.jpg" alt="orange cat">
          <img src="4.jpg" alt="orange cat">
>
        </div>
      </div>

      <div class="top-column">
          <img src="4.jpg" alt="selfie cat">
      </div>

      <div class="top-column narrow">
        <img src="10.jpg" alt="grumpy-looking fluffy cat">
      </div>
    </section>

    <section class="title">
      <h1>HEADLINES</h1>
      <p>CUTE ANIMALS</p>
    </section>

    <section class="bottom-collage" aria-label="Lower photo collage">
      <div class="bottom-column left">
        <div class="image-row">
          <img src="7.jpg" alt="eating cat">
          <img src="1.jpg" alt="white cat">
          <img src="3.jpg" alt="white cat">
        </div>
       <img src="18.jpg" alt=" group of weasel">
      </div>

      <div class="bottom-column center">
        <img src="19.jpg" alt="white cat">
      </div>

      <div class="bottom-column right">
        <div class="image-row">
          <img src="22.jpg" alt="cat">
          <img src="21.jpg" alt="panda">
        </div>
        <img src="25.jpg" alt="panda">
      </div>
    </section>
  </main>
</body>
</html>
